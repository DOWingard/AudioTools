name: Test & Deploy

on:
  push:
    branches: [unified-ui]

jobs:
  # ── Auth unit tests (fast, no external deps) ────────────────────
  test-auth:
    name: Auth — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auth/requirements.txt

      - run: pip install -r auth/requirements.txt pytest pytest-asyncio
      - run: pytest tests/test_auth_unit.py -v
        env:
          DATABASE_URL: postgresql://test:test@localhost/testdb

  # ── UI build check ───────────────────────────────────────────────
  test-ui:
    name: UI — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

  # ── Deploy to Hetzner ────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [test-auth, test-ui]
    steps:
      - name: SSH → pull & restart
        uses: appleboy/ssh-action@v1
        with:
          host: 5.78.151.216
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/audiotools/.git ]; then
              cp /opt/audiotools/.env /tmp/.env.bak 2>/dev/null || true
              rm -rf /opt/audiotools
              git clone git@github.com:DOWingard/AudioTools.git /opt/audiotools --recurse-submodules
              cp /tmp/.env.bak /opt/audiotools/.env 2>/dev/null || true
            fi
            cd /opt/audiotools
            git pull origin unified-ui

            # If postgres is running with stale credentials, wipe the volume so it
            # reinitialises with the current .env values on the next compose up.
            PG_USER=$(grep '^POSTGRES_USER=' .env | cut -d= -f2 | tr -d '[:space:]')
            PG_USER=${PG_USER:-audiotility}
            if ! docker compose exec -T postgres psql -U "$PG_USER" -c '\q' "$PG_USER" 2>/dev/null; then
              echo "Postgres credential mismatch or not running — reinitialising data volume"
              docker compose rm -sf postgres 2>/dev/null || true
              docker volume rm audiotools_postgres_data 2>/dev/null || true
            fi

            docker compose up --build -d --remove-orphans || {
              echo "=== DEPLOY FAILED — auth container logs ==="
              docker compose logs --tail=80 auth
              echo "=== postgres container logs ==="
              docker compose logs --tail=20 postgres
              exit 1
            }
            docker image prune -f
            echo "Deploy complete — stack is up"
