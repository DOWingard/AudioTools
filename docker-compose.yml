services:
  minio:
    image: minio/minio:latest
    container_name: syntag_minio
    command: server /data --console-address ":9001"
    environment:
      # Use the same credentials as R2 so compute can switch between them seamlessly.
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"   # S3 API  (9000 may be taken by another project)
      - "9011:9001"   # MinIO Console (admin UI)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: syntag_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET: ${R2_BUCKET_NAME:-syntag-audio}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        echo 'MinIO bucket ready.' &&
        exit 0
      "
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: syntag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: syntag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audiotility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Riddim4Life42069!}
      POSTGRES_DB: ${POSTGRES_DB:-audiotility}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audiotility}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: syntag_auth
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiotility}:${POSTGRES_PASSWORD:-Riddim4Life42069!}@postgres:5432/${POSTGRES_DB:-audiotility}
      - COMPUTE_API_URL=http://compute:8000
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  compute:
    build:
      context: .
      dockerfile: Dockerfile.compute
    container_name: syntag_compute
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
      - AUTH_SERVICE_URL=http://auth:8001
      # Object storage — overridden from .env
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-syntag-audio}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9010}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-minioadmin}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-minioadmin}
      # Dev/test bypass: set to a clerk_id to skip Clerk JWT validation in endpoints
      - DEV_USER_ID=${DEV_USER_ID:-}
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
    volumes:
      - ./LARS:/app/LARS:ro
    depends_on:
      qdrant:
        condition: service_started
      auth:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: syntag_ui
    ports:
      - "80:7860"
    environment:
      - COMPUTE_API_URL=http://compute:8000
    depends_on:
      compute:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
