services:
  postgres:
    image: postgres:17-alpine
    container_name: syntag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syntag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syntag_secret}
      POSTGRES_DB: ${POSTGRES_DB:-syntag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syntag}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: syntag_auth
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-syntag}:${POSTGRES_PASSWORD:-syntag_secret}@postgres:5432/${POSTGRES_DB:-syntag}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  compute:
    build:
      context: .
      dockerfile: Dockerfile.compute
    container_name: syntag_compute
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: syntag_ui
    ports:
      - "7860:7860"
    environment:
      - COMPUTE_API_URL=http://compute:8000
    depends_on:
      compute:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
