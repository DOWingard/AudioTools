services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # qdrant/qdrant is a minimal image with no curl/wget; use a bash TCP check instead
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    container_name: audio_search_app
    ports:
      - "7860:7860"
    volumes:
      - ./samples:/app/samples
    environment:
      - QDRANT_HOST=qdrant
      - PYTHONPATH=/app
      - SAMPLES_DIR=/app/samples
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
