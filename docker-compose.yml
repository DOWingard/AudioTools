services:
  compute:
    build:
      context: .
      dockerfile: Dockerfile.compute
    container_name: syntag_compute
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: syntag_ui
    ports:
      - "7860:7860"
    environment:
      - COMPUTE_API_URL=http://compute:8000
    depends_on:
      compute:
        condition: service_healthy
    restart: unless-stopped

volumes: {}
